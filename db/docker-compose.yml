# SIGAF · base distribuida con Patroni (issue #9)
#
#   etcd ........... dónde Patroni anota quién es el primario de cada fragmento
#   pg-a1, pg-a2 ... fragmento A (CCB, CCSH, CCA): Patroni elige primario y réplica
#   pg-b1, pg-b2 ... fragmento B (CCEA, CCS, CCDC)
#   haproxy ........ puerta fija: 5432/5433 = A primario/réplica, 5434/5435 = B
#   mongo .......... base de análisis (issue #8); la llena el ETL de datos/analitica
#   respaldos ...... pg_dump de A y B cada 24 h, desde la réplica y con TLS (issue #26)
#   api ............ FastAPI en http://localhost:8000, entra a A y B por HAProxy con TLS (#28)
#
# Uso:  cd db && docker compose up -d --build
#       docker compose exec pg-a1 patronictl list      (quién es primario)
#       bash patroni/prueba_caida.sh                    (prueba de caída)
#       bash monitoreo/estado.sh                        (monitoreo, issue #26)
#       docker compose exec respaldos respaldar.sh una  (respaldo ahora mismo)
#       curl http://localhost:8000/health                (la API, issue #28)
name: sigaf

x-nodo: &nodo
  build: ./patroni
  image: sigaf-patroni:16
  restart: unless-stopped
  environment: &entorno
    SIGAF_PASS_SUPER: ${SIGAF_PASS_SUPER:?falta en .env}
    SIGAF_PASS_REPL: ${SIGAF_PASS_REPL:?falta en .env}
    SIGAF_PASS_ADMIN: ${SIGAF_PASS_ADMIN:?falta en .env}
    SIGAF_PASS_API: ${SIGAF_PASS_API:?falta en .env}
    SIGAF_PASS_ETL: ${SIGAF_PASS_ETL:?falta en .env}
    SIGAF_PASS_RESPALDO: ${SIGAF_PASS_RESPALDO:?falta en .env}
  depends_on:
    etcd: { condition: service_started }
    certificados: { condition: service_completed_successfully }

services:
  # Genera la CA y un certificado por nodo con el script de Ricardo (una vez).
  # Además copia SOLO ca.crt (público) al volumen ca-publica (issue #28): así
  # la API puede verificar a los nodos sin tener montados ca.key ni las llaves.
  certificados:
    build: ./patroni
    image: sigaf-patroni:16
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        if [ -f /out/certs/pg-b2.crt ]; then
          echo "certificados ya existen"
        else
          sed 's/\r$$//' /infra/generar_certificados.sh > /out/generar_certificados.sh
          bash /out/generar_certificados.sh pg-a1 pg-a2 pg-b1 pg-b2
        fi
        install -m 644 /out/certs/ca.crt /out/ca-publica/ca.crt
    volumes:
      - ../infra/postgres:/infra:ro
      - certs:/out/certs
      - ca-publica:/out/ca-publica

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.17
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd:/etcd-data

  pg-a1:
    <<: *nodo
    hostname: pg-a1
    environment: { <<: *entorno, NODO: pg-a1, FRAGMENTO: a }
    volumes: [pg-a1:/var/lib/postgresql/data, certs:/certs:ro, ./:/sigaf-sql:ro]
  pg-a2:
    <<: *nodo
    hostname: pg-a2
    environment: { <<: *entorno, NODO: pg-a2, FRAGMENTO: a }
    volumes: [pg-a2:/var/lib/postgresql/data, certs:/certs:ro, ./:/sigaf-sql:ro]
  pg-b1:
    <<: *nodo
    hostname: pg-b1
    environment: { <<: *entorno, NODO: pg-b1, FRAGMENTO: b }
    volumes: [pg-b1:/var/lib/postgresql/data, certs:/certs:ro, ./:/sigaf-sql:ro]
  pg-b2:
    <<: *nodo
    hostname: pg-b2
    environment: { <<: *entorno, NODO: pg-b2, FRAGMENTO: b }
    volumes: [pg-b2:/var/lib/postgresql/data, certs:/certs:ro, ./:/sigaf-sql:ro]

  haproxy:
    image: haproxy:2.8
    restart: unless-stopped
    ports:
      - "5432:5432"
      - "5433:5433"
      - "5434:5434"
      - "5435:5435"
      - "7000:7000"
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [pg-a1, pg-a2, pg-b1, pg-b2]

  # Análisis (issue #8): MongoDB con usuario y contraseña. Solo escucha en esta
  # computadora (127.0.0.1); el ETL y la API lo ven por la red de Docker como mongo:27017.
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: sigaf
      MONGO_INITDB_ROOT_PASSWORD: ${SIGAF_PASS_MONGO:?falta en .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Respaldos (issue #26). Misma imagen que los nodos (trae pg_dump 16), pero
  # no arranca Patroni: solo corre respaldar.sh. Los .dump quedan en el
  # volumen "respaldos" (fuera del repo: tienen datos de alumnos).
  respaldos:
    image: sigaf-patroni:16
    restart: unless-stopped
    entrypoint: ["bash", "-c", "sed 's/\\r$$//' /scripts/respaldar.sh > /usr/local/bin/respaldar.sh && chmod +x /usr/local/bin/respaldar.sh && exec respaldar.sh"]
    environment:
      SIGAF_PASS_RESPALDO: ${SIGAF_PASS_RESPALDO:?falta en .env}
      INTERVALO: ${SIGAF_RESPALDO_INTERVALO:-86400}
      GUARDAR: ${SIGAF_RESPALDO_GUARDAR:-7}
      TZ: America/Mexico_City
    volumes:
      - ./respaldos:/scripts:ro
      - certs:/certs:ro
      - respaldos:/respaldos
    depends_on: [pg-a1, pg-a2, pg-b1, pg-b2]

  # API (issue #28). Entra como sigaf_api_svc a A (haproxy:5432) y, con el
  # directorio_fragmento, a B (haproxy:5434). TLS obligatorio con verify-ca:
  # los certificados dicen pg-a1/pg-b1..., no "haproxy", por eso no verify-full
  # (decisión de alex, igual que el ETL). Solo monta ca-publica (nunca ca.key).
  # Puerto solo en 127.0.0.1 mientras no haya HTTPS (va con Seguridad).
  api:
    build: ../api
    image: sigaf-api:0.1
    restart: unless-stopped
    environment:
      SIGAF_PASS_API: ${SIGAF_PASS_API:?falta en .env}
      SIGAF_LLAVE_DATOS: ${SIGAF_LLAVE_DATOS:?falta en .env}
      SIGAF_LLAVE_SEUDONIMO: ${SIGAF_LLAVE_SEUDONIMO:?falta en .env}
      SIGAF_DB_HOST: haproxy
      SIGAF_DB_PORT: "5432"
      SIGAF_DB_NOMBRE: postgres
      SIGAF_DB_SSLMODE: verify-ca
      SIGAF_DB_SSLROOTCERT: /ca/ca.crt
      SIGAF_MONGO_URI: mongodb://sigaf:${SIGAF_PASS_MONGO:?falta en .env}@mongo:27017/?authSource=admin
      SIGAF_MONGO_DB: sigaf_analitica
      SIGAF_CORS_ORIGENES: ${SIGAF_CORS_ORIGENES:-http://localhost:8080}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ca-publica:/ca:ro
    depends_on:
      certificados: { condition: service_completed_successfully }
      haproxy: { condition: service_started }
      mongo: { condition: service_healthy }

# La red usa 192.168.x para que coincida con el pg_hba.conf de Ricardo
# (replicación solo desde 192.168.0.0/16 y la VPN 10.8.0.0/24).
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.77.0/24

volumes:
  certs:
  ca-publica:
  etcd:
  pg-a1:
  pg-a2:
  pg-b1:
  pg-b2:
  mongo:
  respaldos:
