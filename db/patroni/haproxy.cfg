# SIGAF · HAProxy: la "puerta fija" de cada fragmento (issue #9).
# Le pregunta a Patroni (puerto 8008) quién es el primario o la réplica
# ahorita; si hay failover, cambia solo y la API no se entera.
#   5432 = primario A   5433 = réplica A   5434 = primario B   5435 = réplica B
global
    maxconn 200

resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s
    option httpchk
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none

listen a_primario
    bind *:5432
    http-check send meth GET uri /primary
    server pg-a1 pg-a1:5432 check port 8008
    server pg-a2 pg-a2:5432 check port 8008

listen a_replica
    bind *:5433
    http-check send meth GET uri /replica
    server pg-a1 pg-a1:5432 check port 8008
    server pg-a2 pg-a2:5432 check port 8008

listen b_primario
    bind *:5434
    http-check send meth GET uri /primary
    server pg-b1 pg-b1:5432 check port 8008
    server pg-b2 pg-b2:5432 check port 8008

listen b_replica
    bind *:5435
    http-check send meth GET uri /replica
    server pg-b1 pg-b1:5432 check port 8008
    server pg-b2 pg-b2:5432 check port 8008

# Tablero en http://localhost:7000 : verde = ese nodo atiende ese puerto
listen tablero
    bind *:7000
    mode http
    option httplog
    stats enable
    stats uri /
    stats refresh 2s
