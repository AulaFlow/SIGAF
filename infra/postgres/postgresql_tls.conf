# =====================================================================
# SIGAF · infra/postgres/postgresql_tls.conf  (issue #6)
# Agregar a postgresql.conf de cada nodo (o en la sección
# postgresql.parameters de Patroni). Rutas dentro del contenedor.
# =====================================================================
ssl = on
ssl_cert_file = '/certs/nodo.crt'
ssl_key_file  = '/certs/nodo.key'
ssl_ca_file   = '/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# Bitácora de accesos (Seguridad: registro de conexiones al sistema)
log_connections = on
log_disconnections = on
# NO usar log_statement = 'all': escribiría en el log las llaves que la
# API pone en la sesión con set_config().
log_statement = 'ddl'
