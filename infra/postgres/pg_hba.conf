# =====================================================================
# SIGAF · infra/postgres/pg_hba.conf  (issue #6)
# Decisión del equipo: TLS obligatorio entre nodos y desde la API; solo la
# conexión LOCAL del administrador (mismo equipo) puede ir sin TLS.
# PostgreSQL usa la PRIMERA regla que coincide, por eso el orden importa.
# Ajustar 192.168.0.0/16 y 10.8.0.0/24 a la red local y a la VPN reales.
# =====================================================================
# TIPO      BASE         USUARIO            ORIGEN          MÉTODO

# 1. Dentro del contenedor/equipo (socket): mantenimiento del superusuario
local       all          postgres                           peer

# 2. Administrador desde el mismo equipo, sin TLS (decisión del equipo)
host        all          sigaf_dba          127.0.0.1/32    scram-sha-256

# 3. Replicación entre nodos (Patroni): SOLO con TLS
hostssl     replication  sigaf_replicador   192.168.0.0/16  scram-sha-256
hostssl     replication  sigaf_replicador   10.8.0.0/24     scram-sha-256

# 4. API y ETL (y el admin desde otro equipo): SOLO con TLS
hostssl     all          sigaf_api_svc      0.0.0.0/0       scram-sha-256
hostssl     all          sigaf_etl_svc      0.0.0.0/0       scram-sha-256
hostssl     all          sigaf_dba          0.0.0.0/0       scram-sha-256

# 5. Cualquier otra conexión sin TLS se rechaza
hostnossl   all          all                0.0.0.0/0       reject
host        all          all                0.0.0.0/0       reject
